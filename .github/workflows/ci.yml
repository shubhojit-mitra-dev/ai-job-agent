name: CI Quality Gate

on:
  push:
    branches:
      - master
      - "milestone-*"
      - "phase-*"
  pull_request:
    branches:
      - master
      - "milestone-*"
      - "phase-*"

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Lint, Type-Check & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --all-groups

      - name: Check code formatting (Ruff format)
        run: uv run ruff format --check .

      - name: Check lint rules (Ruff check)
        run: uv run ruff check .

      - name: Static type analysis (Mypy)
        run: uv run mypy .

      - name: Execute automated test suite (Pytest)
        run: uv run pytest -v

  frontend-quality:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Next.js ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
