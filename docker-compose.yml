# Root Docker Compose entrypoint delegating to infrastructure services.
#
# Requirements:
# - Docker Compose v2.20.0 or higher is required for the top-level 'include:' directive.
# - For Docker Compose versions below v2.20.0, invoke infra compose directly:
#   docker compose -f infra/docker/docker-compose.yml up -d
include:
  - infra/docker/docker-compose.yml
